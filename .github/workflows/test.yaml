name: Test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install Python dependencies
      run: uv sync --dev

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Enables the skipif-gated xsd->tsp->proto round-trip tests; without it,
    # `_tsp.tsp_available()` is false and those tests skip.
    - name: Install TypeSpec toolchain
      working-directory: tests/xsdformer/typespec/tsp_project
      run: npm install

    - name: Run tests
      run: uv run pytest

[project]
name = "xsdformer"
version = "1.0.0"
description = "Generate Protobuf definitions, JSON Schema, and Python XML-to-protobuf converters from XSD and DTD schemas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Toby Sargeant" }]
keywords = ["xsd", "dtd", "protobuf", "json-schema", "typespec", "code-generation", "xml", "clinvar", "bioc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "grpcio-tools>=1.60",
    "jinja2>=3.1.6",
    "lxml>=5.0",
    "protobuf>=6.32.1",
    "pyyaml>=6.0.3",
    "xmlschema>=4.0",
]

[project.urls]
Repository = "https://github.com/populationgenomics/xsd-former"
Issues = "https://github.com/populationgenomics/xsd-former/issues"

[dependency-groups]
dev = [
    "datamodel-code-generator",
    "jsonschema",
    "pydantic>=2",
    "pytest>=8.4.1",
    "ruff",
]

[project.scripts]
xsdformer = "xsdformer.tool:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xsdformer"]

[tool.ruff]
line-length = 120
target-version = "py311"
indent-width = 4

[tool.ruff.lint]
select = ["A", "B", "C",  "E", "F", "G", "I", "N", "Q", "S", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "ERA", "EXE", "ICN", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "UP", "YTT"]
ignore = [
    "ANN101",  # missing-type-self
    "PD011",   # pandas-use-of-dot-values (false positive)
]
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "ERA", "EXE", "FBT", "ICN", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "UP", "YTT"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # asserts.
    "S102",     # exec().
    "PLR2004",  # magic value comparisons.
    "SLF001"    # private method access.
]

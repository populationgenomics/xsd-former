[project]
name = "xsd-former"
version = "1.3.0"
description = "Generate Protobuf definitions, JSON Schema, and Python XML-to-protobuf converters from XSD and DTD schemas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Toby Sargeant" }]
keywords = ["xsd", "dtd", "protobuf", "json-schema", "typespec", "code-generation", "xml", "clinvar", "bioc"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "grpcio-tools>=1.60",
    "jinja2>=3.1.6",
    "lxml>=5.0",
    "protobuf>=6.32.1",
    "pyyaml>=6.0.3",
    "xmlschema>=4.0",
]

[project.urls]
Repository = "https://github.com/populationgenomics/xsd-former"
Issues = "https://github.com/populationgenomics/xsd-former/issues"

# Supply-chain age gate: never resolve a release younger than 7 days. Declared
# in-repo so CI and contributors inherit the same resolution.
[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
test = ["datamodel-code-generator", "jsonschema", "pydantic>=2", "pytest>=8.4.1"]
# pre-commit and pyright are in the lint group because CI runs the whole
# static-check gate via `uv run pre-commit run --all-files`. pyright checks
# src/ + tests/, so the group carries the test deps for those imports to resolve.
lint = [
    "ruff",
    "pyright",
    "pre-commit",
    "datamodel-code-generator",
    "jsonschema",
    "pydantic>=2",
    "pytest>=8.4.1",
    "lxml-stubs>=0.5.1",
]

[project.scripts]
xsdformer = "xsdformer.tool:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xsdformer"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "W",
    "ANN", "ARG", "BLE", "COM", "DTZ", "ERA", "EXE", "ICN", "ISC",
    "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE", "RUF",
    "SIM", "SLF", "T10", "TID", "UP", "YTT",
]

fixable = ["ALL"]

ignore = [
    "COM812",  # Trailing comma prohibited (conflicts with the formatter)
    # D1xx -- docstring *presence*. We enforce docstring format (D2/D3/D4) when
    # a docstring exists, but don't require one on every public symbol.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "Q000",    # Single quotes found but double quotes preferred
    "Q003",    # Change outer quotes (conflicts with single-quote formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # asserts are the standard pytest idiom
    "S102",   # exec() compiles generated converters under test
    "SLF001", # tests legitimately reach into module privates
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["xsdformer"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# Complexity thresholds: roughly double the ruff defaults so the checks fire on
# genuinely sprawling code but not on everyday parsers and dispatchers.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 20
max-returns = 10
max-statements = 80
max-locals = 25

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
typeCheckingMode = "standard"

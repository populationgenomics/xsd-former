inline_wrappers: true
flatten_list_wrappers: true
comments:
  Accession.date_deleted: The date the SCV was deleted.
  Accession.value: The accession of the deleted SCV.
  Accession.version: The version of the deleted SCV.
  AggregateGermlineReviewStatusValue: >-
    Aggregate review status (star rating) across all germline submissions. 0 stars: no assertion
    criteria provided; 1 star: single submitter with criteria, or conflicting interpretations;
    2 stars: multiple submitters with criteria and no conflicts; 3 stars: reviewed by expert panel;
    4 stars: practice guideline.
  AggregateOncogenicityReviewStatusValue: >-
    Aggregate review status (star rating) across all oncogenicity submissions.
    Uses the same 0-4 star scale as AggregateGermlineReviewStatusValue.
  AggregateSomaticClinicalImpactReviewStatusValue: >-
    Aggregate review status (star rating) across all somatic clinical impact submissions.
    Note: somatic submissions do not calculate conflicts, so the 1-star 'conflicting
    interpretations' category does not apply.
  AggregatedGermlineClassification.description: >-
    Germline classification following ACMG/AMP five-tier criteria: Pathogenic, Likely pathogenic,
    Uncertain significance, Likely benign, Benign. May also be 'Conflicting classifications of
    pathogenicity' when submitters disagree. See
    https://github.com/ncbi/clinvar/ClassificationOnClinVar.md.
  AggregatedGermlineClassification.explanation: >-
    Populated only when description is 'conflicting data from submitters'. Summarizes the
    nature of the conflict across SCVs.
  AggregatedGermlineClassification.review_status: Aggregate review status (star rating) from all germline submissions for this variant.
  AggregatedOncogenicityClassification.description: >-
    Oncogenicity classification following ClinGen/CGC/VICC five-tier criteria: Oncogenic, Likely
    oncogenic, Uncertain significance, Likely benign, Benign. May also be 'Conflicting
    classifications' when submitters disagree. See
    https://github.com/ncbi/clinvar/ClassificationOnClinVar.md.
  AggregatedOncogenicityClassification.explanation: >-
    Populated only when description is 'conflicting data from submitters'. Summarizes the
    nature of the conflict across SCVs.
  AggregatedOncogenicityClassification.review_status: Aggregate review status (star rating) from all oncogenicity submissions for this variant.
  AggregatedSomaticClinicalImpact.description: >-
    Somatic clinical impact classification following AMP/ASCO/CAP four-tier criteria: Tier I -
    Strong clinical significance, Tier II - Potential clinical significance, Tier III - Unknown
    clinical significance, Tier IV - Benign/likely benign. See
    https://github.com/ncbi/clinvar/ClassificationOnClinVar.md.
  AggregatedSomaticClinicalImpact.review_status: Aggregate review status (star rating) from all somatic clinical impact submissions for this variant.
  Allele: >-
    A single sequence change (simple allele) relative to a reference. Has an AlleleID that
    persists across record versions. Contrast with Haplotype (multiple changes on one chromosome)
    and Genotype (changes on both chromosomes of a homologous pair).
  Allele.allele_id: >-
    Numeric identifier for this allele, stable across record versions. Distinct from the
    VariationID on VariationArchiveType, which identifies the overall classified variation record.
  Allele.canonical_spdi: >-
    Canonical representation in SPDI format (Sequence:Position:Deletion:Insertion), which
    provides a context-free, unambiguous description of the variant independent of transcript
    or genome build.
  Allele.gene_list: 0 to many genes (and related data) related to the allele being reported.
  Allele.protein_change: Single-letter representations of the protein change (e.g. R123H).
  AlleleDescr: Description of an allele in a co-occurrence set, used in trans/cis analysis.
  AlleleScv: An allele from a single submitted clinical variant record (SCV).
  AlleleScv.gene_list: 0 to many genes (and related data) related to the allele being reported.
  AlleleScv.molecular_consequence_list: Currently redundant with the MolecularConsequence element of the HGVS element.
  AlleleScv.protein_change: Single-letter representation of the amino acid change and its location.
  Attribute.type: Type key for the attribute value. Examples include 'GARD id', 'keyword'.
  ChromosomeStr: >-
    Chromosome for the variant location. Values are 1-22, X, Y, and MT. For pseudoautosomal
    regions, submit on X; ClinVar will calculate the corresponding Y location.
  Citation.citation_text: Use only when there is no database ID for the publication and no URL.
  Citation.type: >-
    NCBI-assigned citation type, not expected from submitters. Values include: general, review,
    practice guideline, Position Statement, Translational/Evidence-based, Suggested Reading,
    Recommendation.
  Citation.url: Complete URL of the citation.
  ClassificationTypeScv: >-
    The classification from a single submitted clinical variant record (SCV). This is one
    submitter's verdict, before aggregation across all SCVs into the VCV.
  ClassificationTypeScv.comment: Explanation of the classification, providing the submitter's rationale.
  ClassificationTypeScv.date_last_evaluated: Date the classification was last evaluated by the submitter.
  ClassificationTypeScv.review_status: Single-submitter review status; see SubmitterReviewStatusValue for allowed values.
  ClinAsserTraitSetType: A set of traits from a single submitted clinical variant record (SCV).
  ClinAsserTraitSetType.contributes_to_aggregate_classification: >-
    If false, this SCV is excluded from the aggregate VCV classification calculation
    (e.g. when no assertion criteria were provided).
  ClinAsserTraitSetType.lower_level_of_evidence: Whether this submission is flagged as providing a lower level of evidence.
  ClinAsserTraitSetType.multiple_condition_explanation: An explanation provided when the submission covers multiple conditions simultaneously.
  ClinAsserTraitType.clinical_features_affected_status: Whether each clinical feature was present, absent, or not tested in the observed individuals.
  ClinAsserTraitType.trait_relationship: Relationships to other traits (e.g. Subphenotype, DrugResponseAndDisease).
  ClinVarAccession: >-
    The SCV (Submitted Classification of Variants) accession for one submitter's record.
    SCV accessions have the format SCV + 9 digits + version suffix (e.g. SCV000000001.1).
  ClinVarAccession.date_created: Date when this SCV first became public in ClinVar.
  ClinVarAccession.date_updated: Date when the latest update to this SCV became public in ClinVar.
  ClinVarAccession.type: Always 'SCV'. Maintained for consistency with ClinVarFullRelease.
  ClinVarSubmissionId.local_key: >-
    Identifier provided by the submitter to match their internal records. If not provided by
    the submitter, NCBI generates one. Whether submitter-provided is indicated by
    local_key_is_submitted.
  ClinVarSubmissionId.local_key_is_submitted: True if the local_key was provided by the submitter (vs NCBI-generated).
  ClinicalAssertionRecordHistory: Record of changes to a submitted clinical variant record (SCV).
  ClinicalFeaturesAffectedStatusType: Allowed values are 'present', 'absent', and 'not tested'.
  ClinicalSignificanceType.description: >-
    Carries old-style (pre-2023) clinical significance data from AlleleDescriptionSet within
    Co-occurrenceSet, before the current three-category classification model was adopted.
  ClinicalSignificanceType.explanation: >-
    Populated only when description is 'conflicting data from submitters'. Summarizes the
    nature of the conflict across SCVs.
  ClinicalSignificanceType.review_status: Review status of the submission.
  CoOccurrenceType.zygosity: >-
    Zygosity of the co-occurring variant (e.g. Heterozygous), not the interpretation of
    the primary variant.
  Comment.type: >-
    'public' comments are rendered on the ClinVar website. 'private' comments are stored
    in the database but not publicly displayed. Subtypes of public include ConvertedByNCBI,
    MissingFromAssembly, and AlignmentGapMakesReferenceUncertain.
  Comment.value: Free text comment. Line breaks are retained, but no other formatting.
  FamilyInfo.family_history: >-
    Indicates that at least one other family member has the reported condition; does not
    require those members to be included in this observation set. Allowed values: yes, no.
  FamilyInfo.num_families: Total families tested; denominator for 'Number of families with variant'.
  FamilyInfo.num_families_with_segregation_observed: Families where the variant co-segregates with the condition in two or more family members.
  FamilyInfo.num_families_with_variant: Families in which the variant was observed.
  FamilyInfo.pedigree_id: Anonymous identifier linking individual observations from the same family across multiple records.
  FunctionalConsequence.value: Functional consequence term from the Sequence Ontology (SO) controlled vocabulary.
  Gene.haploinsufficiency: ClinGen haploinsufficiency score and supporting evidence for this gene.
  Gene.property: Keywords for retrieval or display (e.g. genes listed by the ACMG guidelines for secondary findings).
  Gene.source: Whether the gene association was 'calculated' by NCBI or 'submitted' by the submitter.
  Gene.xref: Gene-specific external identifiers, such as MIM number, Gene ID, HGNC ID.
  Genotype: >-
    Sequence changes on both chromosomes of a homologous pair. Contrast with Haplotype
    (changes on one chromosome) and SimpleAllele (a single change).
  Genotype.haplotype: Allows more than 2 haplotypes per genotype to support representation of ploidy.
  Genotype.simple_allele: A single sequence change contributing to this genotype.
  GenotypeScv.haplotype: Allows more than 2 haplotypes per genotype to support representation of ploidy.
  GermlineClassification.review_status: Aggregate review status (star rating) from all germline submissions for this variant.
  Haploinsufficiency: ClinGen haploinsufficiency score for this gene — evidence that losing one copy causes disease.
  Haploinsufficiency.clin_gen: URL to the ClinGen dosage sensitivity page for this gene's haploinsufficiency score.
  Haploinsufficiency.value: Haploinsufficiency score description. E.g. 'Little evidence for dosage pathogenicity', 'Sufficient evidence for dosage pathogenicity'.
  Haplotype: >-
    Multiple sequence changes on one chromosome of a homologous pair (or the mitochondrion).
    Contrast with SimpleAllele (a single change) and Genotype (changes on both chromosomes).
  Haplotype.hgvslist: All HGVS expressions valid for, or used to submit, this haplotype.
  Haplotype.number_of_chromosomes: Number of chromosomes carrying this haplotype.
  Haplotype.number_of_copies: Number of copies of this haplotype.
  HaplotypeScv.number_of_chromosomes: Number of chromosomes carrying this haplotype.
  HaplotypeScv.number_of_copies: Number of copies of this haplotype.
  Id.source: Database providing the citation identifier. E.g. PubMed, PubMedCentral, DOI, NCBI bookshelf.
  Id.value: Identifier from the source database for this citation.
  IncludedRecord: >-
    A simple allele or haplotype referenced by ClassifiedRecords but submitted without an
    independent classification. Included records have no star rating of their own.
  IncludedRecord.classified_variation_list: >-
    Classified variants (with their own VCV) that incorporate this included variant,
    maintaining referential integrity for indexing and retrieval.
  IncludedRecord.haplotype: >-
    A haplotype (multiple sequence changes on one chromosome) included in this record but
    submitted without an independent classification.
  IndicationListType.indication: The indication may be a set of phenotypic descriptions.
  IndicationListType.phenotype_set_type: The type of phenotype grouping (e.g. Disease, DrugResponse, Finding).
  Location.cytogenetic_location: >-
    Cytogenetic band location (e.g. 17q21.31), maintained independently of sequence coordinates
    and can be computed from them.
  Location.sequence_location: >-
    Sequence-based location using 1-based offset coordinates, right-justified to be consistent
    with HGVS. Includes reference and alternate allele, and start/stop values.
  MeasureTraitType: >-
    A single submitted clinical variant record (SCV). Each SCV captures one submitter's
    classification of a variant-condition pair, identified by a unique SCV accession.
  MeasureTraitType.additional_submitters: Additional submitters beyond the primary, used only when a batch has multiple submitters.
  MeasureTraitType.attribute_set: Package representing a unit of information with its source(s), identifiers, and comments.
  MeasureTraitType.clin_var_accession: The SCV accession for this record; only SCV (not VCV or RCV) accessions are stored here.
  MeasureTraitType.contributes_to_aggregate_classification: >-
    If false, this SCV is excluded from the aggregate VCV classification (e.g. no assertion
    criteria provided, or the submission was flagged for exclusion).
  MeasureTraitType.date_created: Date when this SCV first became public in ClinVar.
  MeasureTraitType.date_last_updated: Date when the latest update to this SCV became public in ClinVar.
  MeasureTraitType.fdarecognized_database: Whether the submitting database is FDA-recognized (relevant for somatic variant interpretation).
  MeasureTraitType.replaced_list: SCV accessions that were replaced by (merged into) this SCV.
  MeasureTraitType.replaces: SCV accessions that this record supersedes.
  MeasureTraitType.submission_date: Date ClinVar received this submission (distinct from the public release date in date_created).
  Method.description: Free text supplementing the structured method fields with details not captured elsewhere.
  Method.obs_method_attribute: Attribute specific to a particular method in conjunction with a particular observation.
  Method.source_type: The source type of the method.
  MethodType.description: Free text supplementing the structured method fields with details not captured elsewhere.
  MethodType.obs_method_attribute: Attribute specific to a particular method in conjunction with a particular observation.
  Methodlist: The method used to collect data for a submission.
  MolecularConsequence.rs: dbSNP rs number for this variant.
  Name.type: Classification of the name, e.g. 'Preferred' or 'Alternate'.
  ObservationSet.co_occurrence_set: Co-occurring variants observed in the same individuals, used for cis/trans analysis.
  ObservationSet.observed_data: >-
    AttributeSet with exactly one attribute, optionally supported by citations, xrefs, and
    comments. At least one ObservedData is required; decimal values are stored as strings.
  OncogenicityClassification.review_status: Aggregate review status (star rating) from all oncogenicity submissions for this variant.
  PhenotypeDetails.date_evaluated: Date the phenotype features were evaluated.
  PhenotypeDetails.type: Separates biochemical test results from clinical feature descriptions.
  PhenotypeListDetailsType.phenotype_details: Set of descriptors and values for person-specific phenotype information.
  PhenotypeListDetailsType.phenotype_set_type: The type of phenotype grouping (e.g. Disease, DrugResponse, Finding).
  PhenotypeSet: Category grouping condition types (Disease, DrugResponse, Finding, PhenotypeOnly, etc.).
  ProteinSequenceExpression.single_letter_protein_change: Protein change in single-letter amino acid code, e.g. p.Arg123His → p.R123H.
  Rcv: >-
    An RCV (Reference ClinVar) record. Each RCV links a single variant (VCV) to a single
    condition or condition set. RCV accessions have the format RCV + 9 digits + version suffix.
  Rcv.replaced_list: RCV accessions that were merged into this RCV.
  Rcvlist.independent_observations: Total independent observations supporting the RCV classification.
  Rcvlist.rcvaccession: >-
    RCV accessions referencing this VariationID, supporting indexing and retrieval.
    Does not describe RCV-to-SCV relationships; see clinical_assertion_list for those.
  RcvinterpretedCondition: >-
    The interpreted condition (disease or phenotype) associated with this RCV. The value
    'not provided' is used for submissions where no condition was named.
  RcvinterpretedCondition.db: External database for the condition identifier. Allowed values are OMIM, MedGen, Orphanet, MeSH, HP, MONDO.
  RecordHistory.variation_id: Populated only for VCV records, where the accession is of the form VCV000000009.
  ReleaseType: A full release of the ClinVar database, containing one VariationArchive per classified variant.
  Sample.number_chr_tested: Total chromosomes tested; denominator when 'Number of chromosomes with variant' is reported.
  Sample.number_females: Total female individuals in this observation set.
  Sample.number_males: Total male individuals in this observation set.
  Sample.number_tested: Total individuals in this observation set.
  Sample.sex: >-
    Use only when explicit male/female counts are unavailable but sex composition is known.
    Prefer number_males and number_females when possible.
  Sample.somatic_variant_allele_fraction: Variant allele fraction (VAF) of the somatic variant in the sample.
  SingleGermlineClassification.description: >-
    Germline classification from a single submitter, following ACMG/AMP five-tier criteria.
    See https://github.com/ncbi/clinvar/ClassificationOnClinVar.md.
  SingleGermlineClassification.explanation: >-
    Populated only when description is 'conflicting data from submitters'. Summarizes the
    nature of the conflict.
  SingleGermlineClassification.review_status: Review status (star rating) from this single germline submission.
  SingleOncogenicityClassification.description: >-
    Oncogenicity classification from a single submitter, following ClinGen/CGC/VICC five-tier criteria.
    See https://github.com/ncbi/clinvar/ClassificationOnClinVar.md.
  SingleOncogenicityClassification.explanation: >-
    Populated only when description is 'conflicting data from submitters'. Summarizes the
    nature of the conflict.
  SingleOncogenicityClassification.review_status: Review status (star rating) from this single oncogenicity submission.
  SingleSomaticClinicalImpact.description: >-
    Somatic clinical impact classification from a single submitter, following AMP/ASCO/CAP
    four-tier criteria. See https://github.com/ncbi/clinvar/ClassificationOnClinVar.md.
  SingleSomaticClinicalImpact.review_status: Review status (star rating) from this single somatic clinical impact submission.
  SoftwareSet: Description of software used in variant analysis, including version and purpose.
  SoftwareSet.purpose: Purpose of the software, e.g. 'alignment', 'variant calling', 'annotation'.
  SomaticClinicalImpact.review_status: Aggregate review status (star rating) from all somatic clinical impact submissions for this variant.
  SubmitterReviewStatusValue: >-
    Single-submitter review status (star rating). 0 stars: no assertion criteria provided;
    1 star: assertion criteria provided; 2 stars: reviewed by expert panel or practice guideline.
    For the aggregate rating across all submitters, see AggregateGermlineReviewStatusValue.
  SubmitterType.submitter_name: Name of the person or organization submitting this batch of records.
  TraitMapping.clinical_assertion_id: References clinical_assertion_list[i].id, linking this trait mapping to a specific SCV.
  TraitMapping.mapping_type: >-
    How the submitted trait was matched to a MedGen concept. MAPPING_TYPE_NAME: matched by name
    (mapping_ref is 'Alternate' or 'Preferred', mapping_value is the submitted trait name).
    MAPPING_TYPE_XREF: matched by database ID (mapping_ref is the database name, mapping_value
    is the identifier).
  Triplosensitivity: ClinGen triplosensitivity score for this gene — evidence that gaining an extra copy causes disease.
  Triplosensitivity.clin_gen: URL to the ClinGen dosage sensitivity page for this gene's triplosensitivity score.
  Triplosensitivity.value: Triplosensitivity score description. E.g. 'No evidence available', 'Sufficient evidence for dosage pathogenicity'.
  VariationArchiveType: >-
    Top-level record for a classified variant in ClinVar. Each VCV (Variation Archive) aggregates
    all submissions for a single variation (SimpleAllele, Haplotype, or Genotype). VCV accessions
    have the format VCV + 9 digits + version suffix (e.g. VCV000000351.1).
  VariationArchiveType.accession: >-
    VCV accession assigned to this variant record (e.g. VCV000000351). Paired with version for
    the full versioned accession. Distinct from AlleleID (on the Allele element), which identifies
    the underlying sequence change.
  VariationArchiveType.classified_record: >-
    Classification data for a variant that was independently submitted with its own classification.
    Contrast with included_record, which tracks variants referenced in submissions but without
    their own independent classification.
  VariationArchiveType.date_created: Date when this VCV first became public in ClinVar.
  VariationArchiveType.date_last_updated: >-
    Date of the most recent change to this VCV, including SCV updates and NCBI-added annotations.
    May change without incrementing the version number.
  VariationArchiveType.included_record: >-
    A simple allele or haplotype incorporated into submissions for this VCV, but submitted without
    an independent classification of its own. See IncludedRecord.
  VariationArchiveType.most_recent_submission: Date of the most recently updated or newly added SCV for this VCV.
  VariationArchiveType.record_status: Status of this VCV record (e.g. 'current', 'replaced', 'removed').
  VariationArchiveType.record_type: The variation type for this VCV (SimpleAllele, Haplotype, or Genotype).
  VariationArchiveType.replaced_by: The VCV accession that superseded this record (populated when record_status is 'replaced').
  VariationArchiveType.replaced_list: VCV accessions that have been merged into this record.
  VariationArchiveType.variation_name: ClinVar's preferred display name for this variant, as shown on the website.
  Xref: >-
    Database cross-reference (XRef) linking a concept to an identifier in an external database.
    Used throughout to point to MedGen, OMIM, Orphanet, dbSNP, dbVar, and others.
  Xref.db: Name of the external database. E.g. MedGen, OMIM, Orphanet, Gene, Ensembl, HGNC, dbSNP.
  Zygosity: Zygosity of the co-occurring variant (not the primary interpreted variant), e.g. Heterozygous, Homozygous.

  SingleGermlineClassification.explanation: Explanation is used only when the description is 'conflicting data from submitters' The element summarizes the conflict.
  SingleGermlineClassification.review_status: The aggregate review status based on all germline submissions for this record.
  SingleOncogenicityClassification: The classification of an oncogenicity variant from a single submission.
  SingleOncogenicityClassification.description: We are not providing an enumeration for the values we report for oncogenicity classification within the xsd. Details are in https://github.com/ncbi/clinvar/ClassificationOnClinVar.md.
  SingleOncogenicityClassification.explanation: Explanation is used only when the description is 'conflicting data from submitters' The element summarizes the conflict.
  SingleOncogenicityClassification.review_status: The aggregate review status based on all oncogenic submissions for this record.
  SingleSomaticClinicalImpact: The classification of a somatic clinical impact variant from a single submission.
  SingleSomaticClinicalImpact.description: We are not providing an enumeration for the values we report for somatic clinical impact classification within the xsd. Details are in https://github.com/ncbi/clinvar/ClassificationOnClinVar.md.
  SingleSomaticClinicalImpact.review_status: The aggregate review status based on all somatic clinical impact submissions for this record.
  SoftwareSet: Description of key software.
  SoftwareSet.purpose: The purpose of the software. e.g. alignment, variant calling.
  SomaticClinicalImpact: The somatic clinical impact classification.
  SomaticClinicalImpact.clinical_impact_assertion_type: The clinical impact assertion type.
  SomaticClinicalImpact.clinical_impact_clinical_significance: The clinical impact clinical significance.
  SomaticClinicalImpact.drug_for_therapeutic_assertion: The drug for therapeutic assertion.
  SomaticClinicalImpact.review_status: The aggregate review status based on all somatic clinical impact submissions for this record.
  SomaticClinicalImpact.value: The classification value.
  SomaticVariantInNormalTissue: Whether a somatic variant is present in normal tissue.
  Species: The species of the variation.
  Status: Record status.
  SubmitterReviewStatusValue: Review status indicates the level of confidence in any assertion.
  SubmitterType.submitter_name: The name of the person submitting this batch.
  TraitMapping.clinical_assertion_id: Reference to clinical_assertion_list.clinical_assertion[{num}].id
  TraitMapping.mapping_type: 'The type of the mapping. Can be MAPPING_TYPE_NAME or MAPPING_TYPE_XREF.

    MAPPING_TYPE_NAME: The mapping is done by name. The mapping_value will be the name of the trait.

    MAPPING_TYPE_XREF: The mapping is done by cross-reference. The mapping_value will be an ID from the database specified in mapping_ref.'
  TraitMappingList: A list of trait mappings.
  TraitRelationship: A relationship between traits.
  TraitRelationship.name: The name of the related trait.
  TraitRelationship.source: The source of the relationship.
  TraitRelationship.symbol: The symbol of the related trait.
  TraitRelationship.type: The type of the relationship.
  Triplosensitivity: Triplosensitivity information, including a score from ClinGen.
  Triplosensitivity.clin_gen: The ClinGen triplosensitivity score URL.
  Triplosensitivity.last_evaluated: The date the triplosensitivity was last evaluated.
  Triplosensitivity.value: The value of the triplosensitivity. e.g. 'No evidence available'
  Type: The type of the attribute.
  VariationArchiveType: A variation archive.
  VariationArchiveType.accession: Accession assigned to the variant, or set of variants, that was Classified.
  VariationArchiveType.classified_record: This element describes the classification of a single allele, haplotype, or genotype based on all submissions to ClinVar. This differs from the element IncludedRecord,
    which describes simple alleles or haplotypes, referenced in ClassifiedRecord, but for which no explicit classification was submitted. Once that variation is described, details are added about the phenotypes
    being classified, the classification, the submitters providing the classifications, and all supported evidence.
  VariationArchiveType.comment: A comment about the record.
  VariationArchiveType.date_created: DateCreated is the date when the record first became public in ClinVar.
  VariationArchiveType.date_last_updated: The date the record was last updated in the public database. The update may be a change to one of the submitted records (SCVs) or annotation added to the aggregate
    record by NCBI staff. This date is independent of a version change; annotated added by NCBI may change without representing a change in the version.
  VariationArchiveType.included_record: This element describes a single allele or haplotype included in submissions to ClinVar, but for which no explicit classification was submitted. It also references
    the submissions and the Classified records that include them.
  VariationArchiveType.most_recent_submission: This date is of the most recent submitted record (SCV) for the VCV; it may reflect a new submitted record or an update to a submitted record.
  VariationArchiveType.record_status: The status of the record.
  VariationArchiveType.record_type: The type of the record.
  VariationArchiveType.replaced_by: The record that this record was replaced by.
  VariationArchiveType.replaced_list: The list of VCV accessions this record has replaced.
  VariationArchiveType.species: The species of the variation.
  VariationArchiveType.variation_name: This is ClinVar's name for the variant. ClinVar uses this term in its web displays.
  VariationType: Description of the type of variation.
  Xref: The database cross-reference structure (XRef) is provided to represent pointers to identifiers in other databases for the same concept.
  Xref.db: The name of the database. e.g. Gene, Ensembl, HGNC.
  Xref.url: The URL of the identifier.
  Zygosity: The zygosity of the co-occurring variant, not the interpreted variant.

